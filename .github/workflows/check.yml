name: Jetson host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==8.3.5 numpy pillow pycapnp pycryptodome
      - run: python -m compileall -q tools/jetlink
      - run: >-
          python -m pytest --confcutdir=tools/jetlink
          tools/jetlink/test_hud_media.py tools/jetlink/test_update_host.py
          tools/jetlink/test_host_health.py tools/jetlink/test_hud.py -q
          tools/jetlink/test_wifi.py tools/jetlink/test_refresh_sd_image.py
      - run: mkdir -p dist && python tools/jetlink/build_host_bundle.py dist/precompiled-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-jetson-host-candidate
          path: dist/*
